      tracker. It does not need write access. Each search is logged by the
      service with the account name and the time, but the query text is not
      stored after 30 days. Keep the query short. Queries longer than 500
      characters are rejected with code 400. The tool trims spaces at the
      start and the end of the query before it searches. A query that contains
      only spaces is treated as an empty query. Search results can include
      tickets that the user has muted. These are marked with the muted field
      set to true. The sort parameter accepts updated, created or priority.
      The default sort is updated, in descending order. The priority field
      uses the values low, normal, high and critical, and tickets without a
      priority show normal. The order parameter accepts asc or desc. It
      applies to the sort field that you choose. Use the fields parameter to
      limit the fields in each result. Ticket number and title are always
      returned. Unknown field names in the fields parameter are ignored
      without an error. The response is JSON with a results array, a total
      field, a cursor field and a warnings array. The warnings array lists
      problems that did not stop the search, such as a label that does not
      exist in the project. The tool keeps no state between calls. Each call
      must include the full query and all filters. Filters are combined with a
      logical and. A ticket must match every filter to appear in the results.
      Use the any_label parameter instead when a ticket may match one label
      from a list. The tool follows the visibility rules of the tracker, so a
      ticket that the account cannot read never appears. Attachments are not
      searched. Only the text of the title, the body and the comments is
      searched. Emoji and other non-ASCII characters in the query are matched
      as they are typed. The search index is updated within a few seconds
      after a ticket changes, so a very recent change may not appear at once.
      Saved searches are not part of this tool. Build the same filters again
      in each call, or store them in your own notes.
