should_not_match:
  - Add two numbers and return the sum.
  - text: >-
      Lists the open pull requests in one repository. Returns the number, the
      title, the author and the date of the last update for each pull request.
      Use the state parameter to choose open, closed or all. The limit
      parameter sets the page size, and the default is 30. It only reads and
      never changes them.
    note: A normal description of 300 characters
