# MOAT-T1-018 is the same check for the input schema. Change both files.
# The regex and keyword rules read only the first 32 KiB of a description
# (MaxMatchInputBytes). The match_window heuristic flags a text when this
# window cuts a form of the text (see baseFormsCut in
# internal/rules/normalize.go for which text counts). It also flags a text
# with more than 256 U+009D (C1 OSC starts, see maxStrictOSCStarts): the
# matchers read such a text with a faster regex that can miss a match. The
# escape-sequence padding cases are too long for this file: TestMatchWindowCut
# covers them.
# The long should_match case is one paragraph, repeated until the text is
# longer than MaxMatchInputBytes. The rule format cannot build a text, so keep
# the case longer than the window when the window changes.
id: MOAT-T1-017
title: Tool description is too long or holds too many C1 OSC controls for the regex rules to read in full
severity: high
target: description
match:
  heuristic: match_window
risk: The regex rules read only the first 32 KiB of a description, so padding can push hidden instructions past the part that they read. They read a description with more than 256 C1 OSC controls (U+009D) with a faster regex that can miss a match, so these controls can also hide instructions. The finding detail tells which of the two reasons applies.
remediation: Read the full tool description, mainly the text at the end, and check what it asks the model to do. A benign server rarely has a description this long or with so many invisible control characters. Remove the server or do not use it if the text hides instructions, and report the server to its author. If the description is long for a good reason, ask the author to shorten it. Text in the wrong encoding (UTF-8 read as Latin-1) can also hold many U+009D. Then ask the author to fix the encoding.
references:
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://owasp.org/www-project-mcp-top-10/
