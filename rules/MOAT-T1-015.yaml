# MOAT-T1-016 is the same check for the input schema. Change both files.
# The regex and keyword rules read only the first 32 KiB of a description
# (MaxMatchInputBytes). The match_window heuristic flags any text that they
# do not read in full.
# The long should_match case is one paragraph, repeated until the text is
# longer than MaxMatchInputBytes. The rule format cannot build a text, so keep
# the case longer than the window when the window changes.
id: MOAT-T1-015
title: Tool description is longer than the match window
severity: high
target: description
match:
  heuristic: match_window
risk: The regex rules read only the first 32 KiB of a description, so padding can push hidden instructions past the part that they read.
remediation: Read the full tool description, mainly the text at the end, and check what it asks the model to do. A benign server rarely has a description this long. Remove the server or do not use it if the text hides instructions, and report the server to its author. If the description is long for a good reason, ask the author to shorten it.
references:
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://owasp.org/www-project-mcp-top-10/
