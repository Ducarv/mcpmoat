# GoReleaser v2 config. Check it with: goreleaser check
version: 2

project_name: mcpmoat

# No before.hooks on purpose: a hook would run with the tap token in its env.

git:
  # Sort v0.1.0-rc.1 before v0.1.0 when both tags point at the same commit.
  prerelease_suffix: "-"

builds:
  - id: mcpmoat
    main: ./cmd/mcpmoat
    binary: mcpmoat
    env:
      # CGO off gives a static binary with no libc dependency.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - mcpmoat
    # README.md names the archives with this pattern.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    # Use the commit date, not the checkout time, so the archive digests do
    # not change from run to run. mod_timestamp does the same for the binary.
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # The release workflow publishes the draft after the attestations verify.
  draft: true
  # A re-run after a failed attest, verify or publish step replaces the old draft.
  replace_existing_draft: true
  prerelease: auto

homebrew_casks:
  - name: mcpmoat
    binaries:
      - mcpmoat
    repository:
      owner: Ducarv
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Ducarv/mcpmoat
    description: Offline scanner for malicious or tampered MCP servers
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # auto keeps prerelease tags (for example v0.1.0-rc.1) out of the tap.
    skip_upload: auto
    hooks:
      post:
        # The binary is not notarized, so macOS would quarantine it. Clear the flag on install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/mcpmoat"]
          end
