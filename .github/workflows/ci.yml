name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check module files are tidy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The E2E pin tests run a stdio server, so the binary makes a run
        # directory below the fake HOME. It refuses a parent that other users
        # can write to, such as /tmp on Linux, so t.TempDir must be private.
        env:
          TMPDIR: ${{ runner.temp }}
        run: go test -race -shuffle=on ./...

      - name: Check for known vulnerabilities
        if: runner.os == 'Linux'
        env:
          # Dependabot does not bump this version string. The release-check
          # job checks that release.yml and govulncheck.yml pin the same
          # version.
          GOVULNCHECK_VERSION: v1.9.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

      - name: Version smoke test
        shell: bash
        run: |
          go build -ldflags "-X main.version=ci-smoke" -o "$RUNNER_TEMP/mcpmoat" ./cmd/mcpmoat
          out=$("$RUNNER_TEMP/mcpmoat" version)
          echo "$out"
          case "$out" in
            *"mcpmoat ci-smoke"*) ;;
            *)
              echo "version output does not contain 'mcpmoat ci-smoke'"
              exit 1
              ;;
          esac

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # NFR-01: runs the E2E tests in a network namespace that has only loopback,
  # so a scan that connects to anything else fails the job. It uses no
  # secrets: the tests use fake keys and loopback servers.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tests run with GOPROXY=off, so fill the module and build caches
      # while the network is still there.
      - name: Download modules and build the tests
        run: |
          go mod download
          go version
          go test -count=1 -run '^$' ./cmd/mcpmoat/
          go build ./testdata/servers/...

      - name: Run the E2E tests without network
        # The script makes a private temp dir below TMPDIR: the E2E tests
        # refuse a temp dir that other users can write, such as /tmp.
        env:
          TMPDIR: ${{ runner.temp }}
        run: .github/scripts/run-offline.sh

  # Checks .goreleaser.yaml and builds a snapshot, so a broken release config
  # fails here and not at tag time. It uses no secrets: a snapshot does not
  # publish, so the tap token is not needed.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Dependabot does not bump this version string. The "Check the tool
      # version pins" step below checks that release.yml and CONTRIBUTING.md
      # pin the same version.
      GORELEASER_VERSION: v2.19.0
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the git tags to compute the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tool version pins
        run: |
          # pin prints the version of an "  NAME: vX.Y.Z" line in a file.
          pin() {
            sed -nE 's/^ *'"$1"': *"?(v[0-9][0-9A-Za-z.+-]*[0-9A-Za-z])"? *(#.*)?$/\1/p' "$2"
          }
          rel=$(pin GORELEASER_VERSION .github/workflows/release.yml)
          # CONTRIBUTING.md names the version only in goreleaser/v<major>@<version>.
          doc=$(grep -oE 'goreleaser(/v[0-9]+)?@v[0-9][0-9A-Za-z.+-]*[0-9A-Za-z]' CONTRIBUTING.md | sed 's/.*@//' | sort -u || true)
          if [ "$rel" != "$GORELEASER_VERSION" ] || [ "$doc" != "$GORELEASER_VERSION" ]; then
            echo "::error::The GoReleaser pins differ. ci.yml: $GORELEASER_VERSION. release.yml: $rel. CONTRIBUTING.md: $doc."
            exit 1
          fi
          # The release test job and the weekly govulncheck workflow run
          # govulncheck too. ci.yml is the reference. Each file must have the
          # same pin. The check also lists every govulncheck version token
          # outside comment lines. Each token must use the pin variable. This is
          # a best-effort guard against drift. Review is the real control.
          # The script builds its search text from $at, so it does not match
          # itself in this file.
          at=@
          tok="govulncheck[$at][^[:space:]\"]*"
          ok="govulncheck${at}\$GOVULNCHECK_VERSION"
          want=
          for f in ci release govulncheck; do
            file=".github/workflows/$f.yml"
            v=$(pin GOVULNCHECK_VERSION "$file" || true)
            if [ -z "$v" ]; then
              echo "::error::$f.yml has no GOVULNCHECK_VERSION pin."
              exit 1
            fi
            if [ -z "$want" ]; then want=$v; fi
            if [ "$v" != "$want" ]; then
              echo "::error::The govulncheck pin of $f.yml is $v, expected $want (the pin in ci.yml)."
              exit 1
            fi
            toks=$(grep -v '^ *#' "$file" | grep -o "$tok" || true)
            bad=$(printf '%s\n' "$toks" | grep -vxF "$ok" || true)
            if [ -z "$toks" ] || [ -n "$bad" ]; then
              echo "::error::$f.yml has no govulncheck version token, or a token that does not use the pin variable: $bad"
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser-action verifies the GoReleaser signature only when cosign
      # is on PATH. Without it, it checks only the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

      - name: Check the snapshot artifacts
        run: .github/scripts/check-snapshot.sh
