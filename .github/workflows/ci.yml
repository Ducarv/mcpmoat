name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check module files are tidy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The E2E pin tests run a stdio server, so the binary makes a run
        # directory below the fake HOME. It refuses a parent that other users
        # can write to, such as /tmp on Linux, so t.TempDir must be private.
        env:
          TMPDIR: ${{ runner.temp }}
        run: go test -race -shuffle=on ./...

      - name: Check for known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Version smoke test
        shell: bash
        run: |
          go build -ldflags "-X main.version=ci-smoke" -o "$RUNNER_TEMP/mcpmoat" ./cmd/mcpmoat
          out=$("$RUNNER_TEMP/mcpmoat" version)
          echo "$out"
          case "$out" in
            *"mcpmoat ci-smoke"*) ;;
            *)
              echo "version output does not contain 'mcpmoat ci-smoke'"
              exit 1
              ;;
          esac

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Checks .goreleaser.yaml and builds a snapshot, so a broken release config
  # fails here and not at tag time. It uses no secrets: a snapshot does not
  # publish, so the tap token is not needed.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Dependabot does not bump this version string. Keep it equal to
      # release.yml and CONTRIBUTING.md.
      GORELEASER_VERSION: v2.19.0
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the git tags to compute the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser-action verifies the GoReleaser signature only when cosign
      # is on PATH. Without it, it checks only the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

      - name: Check the snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail

          # The goos x goarch list in .goreleaser.yaml: one archive each, no others.
          targets=(darwin_amd64 darwin_arm64 linux_amd64 linux_arm64)
          for t in "${targets[@]}"; do
            n=$(find dist -maxdepth 1 -name "mcpmoat_*_$t.tar.gz" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "expected 1 archive for $t in dist/, found $n:"
              ls -l dist
              exit 1
            fi
          done
          want=${#targets[@]}
          count=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$count" -ne "$want" ]; then
            echo "expected only the archives for ${targets[*]} in dist/, found $count:"
            ls -l dist
            exit 1
          fi

          if ! (cd dist && sha256sum -c checksums.txt); then
            echo "dist/checksums.txt does not match the archives"
            exit 1
          fi

          bin=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json)
          if [ -z "$bin" ] || [ ! -f "$bin" ]; then
            echo "no linux amd64 binary found in dist/artifacts.json (got '$bin')"
            exit 1
          fi

          info=$(file "$bin")
          echo "$info"
          case "$info" in
            *"statically linked"*) ;;
            *)
              echo "$bin is not statically linked"
              exit 1
              ;;
          esac

          want_v="mcpmoat v$(jq -r .version dist/metadata.json) "
          out=$("$bin" version)
          echo "$out"
          case "$out" in
            "$want_v"*) ;;
            *)
              echo "version output does not start with '$want_v'"
              exit 1
              ;;
          esac
