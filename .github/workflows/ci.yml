name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check module files are tidy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The E2E pin tests run a stdio server, so the binary makes a run
        # directory below the fake HOME. It refuses a parent that other users
        # can write to, such as /tmp on Linux, so t.TempDir must be private.
        env:
          TMPDIR: ${{ runner.temp }}
        run: go test -race -shuffle=on ./...

      - name: Check for known vulnerabilities
        if: runner.os == 'Linux'
        env:
          # Dependabot does not bump this version string. The tool-pins
          # job checks that release.yml and govulncheck.yml pin the same
          # version.
          GOVULNCHECK_VERSION: v1.9.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

      - name: Version smoke test
        shell: bash
        run: |
          go build -ldflags "-X main.version=ci-smoke" -o "$RUNNER_TEMP/mcpmoat" ./cmd/mcpmoat
          out=$("$RUNNER_TEMP/mcpmoat" version)
          echo "$out"
          case "$out" in
            *"mcpmoat ci-smoke"*) ;;
            *)
              echo "version output does not contain 'mcpmoat ci-smoke'"
              exit 1
              ;;
          esac

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # NFR-01: runs the E2E tests in a network namespace that has only loopback,
  # so a scan that connects to anything else fails the job. It uses no
  # secrets: the tests use fake keys and loopback servers.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tests run with GOPROXY=off, so fill the module and build caches
      # while the network is still there.
      - name: Download modules and build the tests
        run: |
          go mod download
          go version
          go test -count=1 -run '^$' ./cmd/mcpmoat/
          go build ./testdata/servers/...

      - name: Run the E2E tests without network
        # The script makes a private temp dir below TMPDIR: the E2E tests
        # refuse a temp dir that other users can write, such as /tmp.
        env:
          TMPDIR: ${{ runner.temp }}
        run: .github/scripts/run-offline.sh

  # Guards the tool version pins and checks the shell scripts in
  # .github/scripts/. It is a separate small job, with no Go setup and no
  # GoReleaser, so that it can be a required check on every branch.
  tool-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest.
      - name: Lint the scripts
        run: shellcheck .github/scripts/*.sh

      - name: Test the pin check
        run: .github/scripts/check-tool-pins-test.sh

      - name: Check the tool version pins
        run: .github/scripts/check-tool-pins.sh

  # Checks .goreleaser.yaml and builds a snapshot, so a broken release config
  # fails here and not at tag time. It then tests the release scripts against
  # the snapshot and checks the snapshot artifacts. It uses no secrets: a
  # snapshot does not publish, so the tap token is not needed.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Dependabot does not bump this version string. The tool-pins job
      # checks that release.yml and CONTRIBUTING.md pin the same version.
      GORELEASER_VERSION: v2.19.0
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the git tags to compute the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser-action verifies the GoReleaser signature only when cosign
      # is on PATH. Without it, it checks only the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

      # The next two tests need jq, file and go, which this job has. The
      # snapshot test reads dist/ from the step above.
      - name: Test the snapshot check
        run: .github/scripts/check-snapshot-test.sh

      - name: Test the verify and publish script
        run: .github/scripts/verify-and-publish-test.sh

      - name: Check the snapshot artifacts
        run: .github/scripts/check-snapshot.sh
