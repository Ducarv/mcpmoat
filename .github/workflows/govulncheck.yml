name: govulncheck

# GitHub reads a schedule only from the file on the default branch (dev).
# This job checks out main, the released code. For the failure notice and the
# 60-day rule, see docs/releasing.md, Weekly vulnerability check.
on:
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache here, so a cache from another workflow cannot change the scan.
          cache: false

      - name: Check for known vulnerabilities
        env:
          # Dependabot does not bump this version string. The release-check
          # job checks that ci.yml and release.yml pin the same version.
          GOVULNCHECK_VERSION: v1.9.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
