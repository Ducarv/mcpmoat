name: release

on:
  push:
    tags: ['v[0-9]*']

# Each job asks for only the permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never stop a release half way through.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache in the release workflow, so a poisoned cache cannot reach it.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        # The E2E pin tests need a private t.TempDir. See ci.yml.
        env:
          TMPDIR: ${{ runner.temp }}
        run: go test -race -shuffle=on ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the GitHub release and upload the archives
      id-token: write # get the OIDC token that signs the attestation
      attestations: write # store the attestation
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and tags to build the changelog.
          fetch-depth: 0
          persist-credentials: false

      # A guard against mistakes, such as a tag on a feature branch. The tag
      # ruleset and the required reviewer on the release environment are the
      # real control. fetch-depth: 0 also fetches origin/main.
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main. Tag a commit on main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache here, so a poisoned cache cannot reach the release binaries.
          cache: false

      # goreleaser-action verifies the GoReleaser signature only when cosign
      # is on PATH. Without it, it checks only the checksum.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Dependabot does not bump this version string. Update it by hand.
          version: v2.19.0
          args: release --clean
        # The tap token lives on this step only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      # GoReleaser makes a draft release. Publish it only after the
      # attestations of the uploaded files verify.
      - name: Verify the uploaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --pattern checksums.txt -D published
          for f in dist/*.tar.gz dist/checksums.txt; do
            cmp "$f" "published/$(basename "$f")"
          done
          for f in published/*; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
