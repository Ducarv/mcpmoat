# Test fixture: invalid on purpose. The file passes Parse and Validate, but its
# regex "(unclosed" has an unclosed group, so Go RE2 cannot compile it. Its
# target is config, so scan never applies it. rules.NewAnalyzer still compiles
# it, so a scan must fail with exit code 2, also with --no-connect.
id: MOAT-X-005
title: Server config holds a pattern that cannot compile
severity: low
target: config
match:
  any_regex:
    - '(unclosed'
risk: The rule cannot run, so the scan must stop with an error and not skip the rule.
remediation: Fix the regex so that Go RE2 can compile it.
references:
  - https://example.com/mcpmoat/rules/moat-x-005
should_match:
  - This text has an unclosed group.
should_not_match:
  - Lists the files in a folder.
